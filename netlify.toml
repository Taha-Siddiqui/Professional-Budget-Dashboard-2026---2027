[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# Send every /api/* request to our single Express function.
# The function itself restores the original /api/... path (see
# netlify/functions/api.js), so all existing routes work unchanged.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
